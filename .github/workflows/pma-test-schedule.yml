name: PMA - Prueba de AGENDAMIENTO (cada 5 min - SOLO PRUEBAS)

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (minimo permitido por GitHub). SOLO para probar.
  workflow_dispatch:          # tambien lanzable a mano

permissions:
  contents: read

concurrency:
  group: pma-test-schedule
  cancel-in-progress: false   # que no se solapen: cada corrida termina de publicar

jobs:
  publicar-prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Marca de tiempo de esta corrida
        id: tag
        run: echo "granule_tag=run-$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"

      - name: Ejecutar SEP para los 3 departamentos y PUBLICAR (etiquetado por corrida)
        working-directory: src
        env:
          GEO_USER:         ${{ secrets.GEO_USER }}
          GEO_PWD:          ${{ secrets.GEO_PWD }}
          GEO_URL:          ${{ secrets.GEO_URL }}
          GEO_WORKSPACE:    ${{ secrets.GEO_WORKSPACE }}
          GEO_STORE_PREFIX: ${{ secrets.GEO_STORE_PREFIX }}
          GEO_FILE_PREFIX:  ${{ secrets.GEO_FILE_PREFIX }}
          PMA_MONTH: "9"                                   # septiembre (fijo para la prueba)
          PMA_YEAR:  "2026"
          PMA_DEPARTMENTS: "Caquetá,Amazonas,Putumayo"     # los 3 departamentos
          PMA_GRANULE_TAG: ${{ steps.tag.outputs.granule_tag }}  # <<< diferencia cada corrida
        run: python resampling_PMA.py
