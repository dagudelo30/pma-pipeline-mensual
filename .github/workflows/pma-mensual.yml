name: PMA Early Warnings (mensual)

on:
  schedule:
    # Dia 5 de cada mes, 06:00 hora Colombia (11:00 UTC). Ajusta el dia si lo necesitas.
    - cron: "0 11 5 * *"
  workflow_dispatch:            # boton para ejecutarlo a mano desde la pestana Actions
    inputs:
      month:
        description: "Mes objetivo 1-12 (vacio = mes actual)"
        required: false
      year:
        description: "Anio objetivo (vacio = anio actual)"
        required: false
      departments:
        description: 'Departamentos separados por coma (vacio = default del notebook)'
        required: false

permissions:
  contents: write               # necesario para el commit mensual que mantiene vivo el repo

concurrency:
  group: pma-mensual
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production      # los secrets viven en este Environment (opcional pero recomendado)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular periodo objetivo
        id: fecha
        run: |
          MES="${{ github.event.inputs.month }}"
          ANIO="${{ github.event.inputs.year }}"
          [ -z "$MES" ]  && MES=$(date -u +%-m)
          [ -z "$ANIO" ] && ANIO=$(date -u +%Y)
          echo "PMA_MONTH=$MES"  >> "$GITHUB_ENV"
          echo "PMA_YEAR=$ANIO"  >> "$GITHUB_ENV"
          echo "periodo=$(printf '%04d-%02d' "$ANIO" "$MES")" >> "$GITHUB_OUTPUT"

      - name: Ejecutar proceso
        working-directory: src          # el script usa rutas relativas ../data y ../outputs (se corre desde src/)
        env:
          GEO_USER: ${{ secrets.GEO_USER }}
          GEO_PWD:  ${{ secrets.GEO_PWD }}
          PMA_MONTH: ${{ env.PMA_MONTH }}
          PMA_YEAR:  ${{ env.PMA_YEAR }}
          PMA_DEPARTMENTS: ${{ github.event.inputs.departments }}
        run: python resampling_PMA.py

      - name: Guardar salidas como artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pma-outputs-${{ steps.fecha.outputs.periodo }}
          path: outputs/**
          if-no-files-found: warn
          retention-days: 90

      - name: Registrar corrida y mantener el repo activo
        if: always()
        run: |
          git config user.name  "pma-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') | periodo=${{ steps.fecha.outputs.periodo }} | estado=${{ job.status }} | run=${{ github.run_id }}" >> logs/corridas.log
          git add logs/corridas.log
          git commit -m "log: corrida ${{ steps.fecha.outputs.periodo }} (${{ job.status }})" || { echo "Sin cambios que commitear"; exit 0; }
          git push

      - name: Correo de exito
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: PMA Bot <${{ secrets.MAIL_USER }}>
          to: destino1@ejemplo.com, destino2@ejemplo.com
          subject: "OK - PMA Early Warnings ${{ steps.fecha.outputs.periodo }}"
          body: |
            El proceso mensual de PMA Early Warnings finalizo correctamente.

            Periodo procesado : ${{ steps.fecha.outputs.periodo }}
            Los GeoTIFF se publicaron en GeoServer (AClimate) y se adjuntan los mapas PNG.

            Log completo de la corrida:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: outputs/mapa_*.png

      - name: Correo de error
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: PMA Bot <${{ secrets.MAIL_USER }}>
          to: destino1@ejemplo.com
          subject: "ERROR - PMA Early Warnings ${{ steps.fecha.outputs.periodo }}"
          body: |
            El proceso mensual de PMA Early Warnings FALLO para el periodo ${{ steps.fecha.outputs.periodo }}.

            Revisa el log para ver el detalle del error:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
