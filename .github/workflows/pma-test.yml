name: PMA - Prueba (solo genera mapas, sin publicar ni correo)

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mes objetivo 1-12 (vacio = mes actual)"
        required: false
      year:
        description: "Anio objetivo (vacio = anio actual)"
        required: false
      departments:
        description: 'Departamentos separados por coma (vacio = default: Caquetá)'
        required: false

permissions:
  contents: read          # solo lectura: esta prueba no hace commits

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular periodo
        id: fecha
        run: |
          MES="${{ github.event.inputs.month }}"
          ANIO="${{ github.event.inputs.year }}"
          [ -z "$MES" ]  && MES=$(date -u +%-m)
          [ -z "$ANIO" ] && ANIO=$(date -u +%Y)
          echo "PMA_MONTH=$MES"  >> "$GITHUB_ENV"
          echo "PMA_YEAR=$ANIO"  >> "$GITHUB_ENV"
          echo "periodo=$(printf '%04d-%02d' "$ANIO" "$MES")" >> "$GITHUB_OUTPUT"

      - name: Ejecutar proceso (SIN publicar en GeoServer)
        working-directory: src
        env:
          PMA_MONTH: ${{ env.PMA_MONTH }}
          PMA_YEAR:  ${{ env.PMA_YEAR }}
          PMA_DEPARTMENTS: ${{ github.event.inputs.departments }}
          PMA_SKIP_PUBLISH: "1"        # <<< freno: genera mapas pero no publica
        run: python resampling_PMA.py

      - name: Subir mapas como artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pma-prueba-${{ steps.fecha.outputs.periodo }}
          path: outputs/**
          if-no-files-found: warn
          retention-days: 14
